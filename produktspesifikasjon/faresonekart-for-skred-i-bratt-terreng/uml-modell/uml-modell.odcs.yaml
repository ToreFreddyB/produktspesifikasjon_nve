  - name: uavhengigKvalitetssikring
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/samfunnssikkerhet/flom-og-skred/janei
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: JaNei
    - property: asDictionary
      value: 'true'
    description: 'angir om rapporten har gjennomgått en uavhengig kvalitetssikring
      (UKS). ''Ja'' indikerer at uavhengig kvalitetssikring er utført, mens ''Nei''
      indikerer at det ikke er utført. En uavhengig kvalitetssikring av leveransen
      sjekker om utredningen følger metodikken i NVEs veiledere for utredning av sikkerhet
      mot skred i bratt terreng, kvikkleireskred eller flom. Kontrollen utføres av
      et annet foretak enn det som har utført fareutredningen


      English definition:

      Indicates whether the report has undergone independent quality assurance. "Yes"
      means that independent quality assurance has been conducted, while "No" means
      it has not. An independent quality assurance of the deliverable verifies whether
      the assessment follows the methodology outlined in NVE’s guidelines for evaluating
      safety against avalanches in steep terrain, quick clay landslides, or floods.
      The review is carried out by a different entity than the one that performed
      the hazard assessment'
  - name: prosjekttype
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/samfunnssikkerhet/flom-og-skred/prosjekttype
