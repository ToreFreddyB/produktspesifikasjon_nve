  - name: hensynTilSkog
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/samfunnssikkerhet/flom-og-skred/janei
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: JaNei
    - property: asDictionary
      value: 'true'
    description: 'angir om skredfaresonen er kartlagt med hensyn til skogens beskyttende
      effekt mot skredfare.

      “Ja” betyr at skogens effekt på skredfaren er vurdert slik den var på tidspunktet
      for kartleggingen.

      “Nei” betyr at skredfaresonen er kartlagt uten å ta hensyn til skogens effekt.


      English definition:

      Indicates whether the avalanche hazard zone has been mapped with consideration
      of the forest’s protective effect on avalanche hazard.

      “Yes” means the zone was mapped taking into account the forest’s effect as it
      was at the time of mapping.

      “No” means the forest’s effect was not considered in the hazard mapping'
