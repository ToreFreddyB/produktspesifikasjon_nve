    customProperties:
    - property: sosiCodeList
      value: Prosjekttype
    - property: asDictionary
      value: 'true'
    description: 'angir for hvilket formål skredfaren opprinnelig ble utredet for


      English definition:

      Indicates the original purpose for which the avalanche hazard was assessed'
  - name: vurdertSkredSannsynlighet
    logicalType: string
    description: 'Lister opp hvilke sannsynligheter som analyseområdet er utredet
      for, med komma som separator. Det kan være utredet for sannsynligheter som ikke
      vises som faresone i analyseområdet, hvis utredningen viser at det ikke er en
      skredfare med en slik sannsynlighet til stede.

      Eksempel: «≥ 1/100», “≥ 1/100, ≥ 1/1000” eller "≥ 1/100, ≥ 1/1000, ≥ 1/5000"


      English definition:

      Lists the probabilities for which the analysis area has been assessed, separated
      by commas.

      The area may have been assessed for probabilities that are not represented as
      hazard zones within the analysis area, if the assessment concludes that no avalanche
      hazard is present at that probability level.

      Example: «≥ 1/100», “≥ 1/100, ≥ 1/1000” eller "≥ 1/100, ≥ 1/1000, ≥ 1/5000"'
